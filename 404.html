<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - synth.page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    h1 {
      font-size: 120px;
      font-weight: 700;
      color: #00d4ff;
      margin-bottom: 20px;
      line-height: 1;
    }

    h2 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    p {
      font-size: 16px;
      color: #808080;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      background: #00d4ff;
      color: #0a0a0a;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist. Maybe it got lost in the sound waves?</p>
    <a href="/">Go to synth.page</a>
  </div>
</body>
</html>
